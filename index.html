<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cielo sopra Vigevano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--sky1:#0d1b3a;--sky2:#2b3f7a;--ink:#fff;--cloud:#ffffff22}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#0a0f1f;font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif}
body{display:grid;place-items:center;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}
.poster{position:relative;container-type:size;width:min(100vw,177.78vh);aspect-ratio:16/9;overflow:hidden;color:var(--ink);
  background:linear-gradient(var(--sky1),var(--sky2));transition:background 2s}
.poster[data-t=day]{--sky1:#4aa8f0;--sky2:#bfe6ff;--cloud:#ffffffcc}
.poster[data-t=dusk]{--sky1:#5b3d8f;--sky2:#ffa870;--cloud:#ffd9c299}
.poster[data-t=night]{--sky1:#0b1534;--sky2:#2a3a78;--cloud:#8fa0d533}
.stars{position:absolute;inset:0;opacity:0;transition:opacity 2s}
.poster[data-t=night] .stars{opacity:1}
.star{position:absolute;width:.25cqw;height:.25cqw;background:#fff;border-radius:50%;animation:tw 3s infinite alternate}
@keyframes tw{to{opacity:.2}}
.orb{position:absolute;right:9cqw;top:7cqh;width:9cqw;height:9cqw;border-radius:50%;transition:all 2s}
.poster[data-t=day] .orb{background:#ffd93b;box-shadow:0 0 0 1.2cqw #ffd93b55,0 0 0 2.6cqw #ffd93b33}
.poster[data-t=dusk] .orb{background:#ff7a45;box-shadow:0 0 0 1.2cqw #ff7a4555;top:30cqh}
.poster[data-t=night] .orb{background:#f4ecd0;box-shadow:inset -2.2cqw -.6cqw 0 #cfc5a0}
.cl{position:absolute;height:4cqh;border-radius:5cqh;background:var(--cloud);animation:drift linear infinite}
.cl::before,.cl::after{content:"";position:absolute;background:inherit;border-radius:50%}
.cl::before{width:5cqh;height:5cqh;left:18%;top:-2.4cqh}
.cl::after{width:7cqh;height:7cqh;left:42%;top:-3.6cqh}
@keyframes drift{from{transform:translateX(-30cqw)}to{transform:translateX(130cqw)}}
.top{position:absolute;left:4cqw;top:4cqh;font-size:2.2cqw;font-weight:600;opacity:.95}
.top small{display:block;font-size:1.4cqw;font-weight:400;opacity:.8}
#status{position:absolute;left:4cqw;bottom:1.6cqh;font-size:1.1cqw;opacity:.55}
.live{position:absolute;right:4cqw;bottom:4.4cqh;display:flex;gap:.8cqw;align-items:center;font-size:1.5cqw}
.dot{width:1.1cqw;height:1.1cqw;border-radius:50%;background:#ff4b4b;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
#stage{position:absolute;left:0;right:0;top:12cqh;height:46cqh;display:grid;place-items:center}
#plane{width:56cqw;filter:drop-shadow(0 1.4cqh 0 #0003);animation:bob 4.5s ease-in-out infinite}
#plane.flip{transform:scaleX(-1)}
#plane svg{width:100%;display:block;overflow:visible}
@keyframes bob{50%{translate:0 -1.6cqh;rotate:-1.2deg}}
.prop{transform-origin:center;transform-box:fill-box;animation:spin .12s linear infinite}
@keyframes spin{to{transform:scaleY(-1)}}
.info{position:absolute;left:0;right:0;bottom:0;height:34cqh;padding:0 4cqw 4cqh;display:flex;flex-direction:column;justify-content:flex-end;
  background:linear-gradient(#0000,#0b1020cc 40%)}
.poster[data-t=day] .info{background:linear-gradient(#0000,#0b2a5acc 40%)}
.who{font-size:1.9cqw;font-weight:400;opacity:.9}
.route{font-size:7.4cqw;font-weight:700;line-height:1.05;letter-spacing:-.02em;white-space:nowrap}
.route i{font-style:normal;color:#ffd93b;padding:0 1.2cqw}
.stats{display:flex;gap:3.2cqw;font-size:2cqw;font-weight:600;margin-top:1cqh}
.stats span{font-weight:400;opacity:.75;font-size:1.5cqw;margin-left:.4cqw}
.compass{position:absolute;right:4cqw;bottom:11cqh;width:7cqw;height:7cqw;border:.35cqw solid #fff9;border-radius:50%;display:grid;place-items:center;font-size:1.3cqw}
.compass b{position:absolute;top:-2cqw;font-weight:600}
.compass svg{width:3.6cqw;transition:transform 1s}
#empty{position:absolute;inset:0;display:none;place-items:center;text-align:center;font-size:4cqw;font-weight:600;padding:0 8cqw}
#empty small{display:block;font-weight:400;font-size:1.8cqw;opacity:.8;margin-top:1.2cqh}
.idle #stage,.idle .info,.idle .compass{display:none}
.idle #empty{display:grid}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="poster idle" id="poster" data-t="night">
  <div class="stars" id="stars"></div>
  <div class="orb"></div>
  <div id="clouds"></div>
  <div class="top">Il cielo sopra Vigevano<small>via Brigate Partigiane 7 · discesa verso Malpensa</small></div>
  <div id="stage"><div id="plane"></div></div>
  <div class="info">
    <div class="who" id="who"></div>
    <div class="route" id="route"></div>
    <div class="stats" id="stats"></div>
  </div>
  <div class="compass"><b>N</b>
    <svg id="arrow" viewBox="0 0 20 20"><path d="M10 1 L16 18 L10 14 L4 18Z" fill="#ff5a4d"/></svg></div>
  <div id="status"></div>
  <div class="live"><div class="dot"></div><span id="clock"></span></div>
  <div id="empty"><div><span id="emptyTxt">Cerco aerei sopra di te…</span><small>Resto in ascolto: appena ne passa uno lo disegno.</small></div></div>
</div>

<script>
// ===== CONFIGURAZIONE =====
const HOME = {lat:45.3158, lon:8.8573};   // Vigevano, via Brigate Partigiane 7 (ritocca se vuoi)
const RADIUS_NM = 20;                      // raggio di ricerca in miglia nautiche
const POLL_MS = 8000;
const APIS = [
  (la,lo,d)=>`https://api.adsb.lol/v2/point/${la}/${lo}/${d}`,
  (la,lo,d)=>`https://api.airplanes.live/v2/point/${la}/${lo}/${d}`,
  (la,lo,d)=>`https://opendata.adsb.fi/api/v2/lat/${la}/lon/${lo}/dist/${d}`
];

// ===== LIVREE (prefisso ICAO callsign -> corpo, coda, accento, nome) =====
const L = {
  ITY:["#f4f6fa","#1f4aa8","#1fa35b","ITA Airways"], RYR:["#f4f6fa","#2a4fd0","#ffd300","Ryanair"],
  EZY:["#ff6a00","#ff6a00","#fff","easyJet"], EJU:["#ff6a00","#ff6a00","#fff","easyJet"],
  WZZ:["#f4f6fa","#c4007a","#c4007a","Wizz Air"], DLH:["#f4f6fa","#0a2a6e","#ffbf00","Lufthansa"],
  AFR:["#f4f6fa","#0a2a6e","#e2272e","Air France"], BAW:["#f4f6fa","#0a2a6e","#e2272e","British Airways"],
  KLM:["#4aa8e8","#4aa8e8","#fff","KLM"], UAE:["#f4f6fa","#d71920","#c9a24b","Emirates"],
  QTR:["#f4f6fa","#5c0632","#5c0632","Qatar Airways"], ETD:["#f4f6fa","#b8975a","#b8975a","Etihad"],
  SWR:["#f4f6fa","#e2272e","#e2272e","Swiss"], VLG:["#f4f6fa","#f2c100","#d3202a","Vueling"],
  TAP:["#f4f6fa","#e2272e","#1b8a4a","TAP Air Portugal"], IBE:["#f4f6fa","#d7192d","#ffc400","Iberia"],
  THY:["#f4f6fa","#d7192d","#d7192d","Turkish Airlines"], AUA:["#f4f6fa","#e2272e","#e2272e","Austrian"],
  SAS:["#f4f6fa","#1c2a6e","#1c2a6e","SAS"], FIN:["#f4f6fa","#1c2a6e","#1c2a6e","Finnair"],
  DAL:["#f4f6fa","#c01933","#003366","Delta"], UAL:["#f4f6fa","#0a4a9e","#0a4a9e","United"],
  AAL:["#c8ccd2","#0c3b7a","#d71920","American"], ELY:["#f4f6fa","#0a3b8e","#0a3b8e","El Al"],
  CLX:["#f4f6fa","#e8c200","#e8c200","Cargolux"], FDX:["#f4f6fa","#4d148c","#ff6200","FedEx"],
  UPS:["#6b4a2b","#6b4a2b","#ffc72c","UPS"], DHX:["#ffcc00","#ffcc00","#d40511","DHL"],
  GEC:["#f4f6fa","#ffcc00","#d40511","Lufthansa Cargo"]
};
const DEF = ["#f4f6fa","#5f7fa8","#e2b03a","Volo"];

// ===== TIPI AEREO =====
const WIDE = "A332 A333 A338 A339 A359 A35K A388 B744 B748 B772 B77L B77W B788 B789 B78X B763 B764 A306 A310 MD11".split(" ");
const PROP = "AT43 AT45 AT72 AT75 AT76 DH8A DH8B DH8C DH8D SF34 E120 PC12 B190 SW4 C208".split(" ");
const NAMES = {A319:"Airbus A319",A320:"Airbus A320",A20N:"Airbus A320neo",A321:"Airbus A321",A21N:"Airbus A321neo",
  A332:"Airbus A330-200",A333:"Airbus A330-300",A359:"Airbus A350-900",A35K:"Airbus A350-1000",A388:"Airbus A380",
  B737:"Boeing 737",B738:"Boeing 737-800",B739:"Boeing 737-900",B38M:"Boeing 737 MAX 8",B744:"Boeing 747-400",
  B772:"Boeing 777-200",B77W:"Boeing 777-300ER",B788:"Boeing 787-8",B789:"Boeing 787-9",E190:"Embraer 190",
  E195:"Embraer 195",BCS1:"Airbus A220-100",BCS3:"Airbus A220-300",AT72:"ATR 72",AT76:"ATR 72-600",DH8D:"Dash 8 Q400",
  CRJ9:"CRJ-900",C172:"Cessna 172",PC12:"Pilatus PC-12"};

const $ = id => document.getElementById(id);
const rad = d => d*Math.PI/180;
const dist = (a,b,c,d)=>{const R=6371,x=rad(c-a),y=rad(d-b);
  const h=Math.sin(x/2)**2+Math.cos(rad(a))*Math.cos(rad(c))*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(h));};

// ===== DISEGNO AEREO (SVG, vista laterale, muso a destra) =====
function planeSVG(kind,[body,tail,acc]){
  const wide = kind==="wide", prop = kind==="prop";
  const h = wide?1.28:prop?.9:1, top = 58-26*h, bot = 58+26*h;
  const eng = prop
    ? `<rect x="238" y="74" width="34" height="16" rx="8" fill="#6d7686"/><g class="prop"><ellipse cx="392" cy="${58}" rx="5" ry="30" fill="#2b2f3a" opacity=".75"/></g>`
    : `<rect x="212" y="${bot-4}" width="56" height="${wide?26:21}" rx="10" fill="#c9d0db" stroke="#7a8496" stroke-width="3"/>
       <ellipse cx="214" cy="${bot+(wide?9:6)}" rx="5" ry="${wide?10:8}" fill="#4a5262"/>`;
  const wing = prop ? `<polygon points="170,${top+4} 300,${top+4} 292,${top+14} 176,${top+14}" fill="#dfe4ec" stroke="#8a93a4" stroke-width="3"/>`
    : `<polygon points="232,${58} 278,${58} 208,${bot+32} 170,${bot+32}" fill="${body==="#f4f6fa"?"#dfe4ec":body}" stroke="#8a93a4" stroke-width="3" stroke-linejoin="round"/>`;
  const wins = Array.from({length:wide?20:15},(_,i)=>`<circle cx="${112+i*(wide?10.4:12.6)}" cy="${top+13}" r="2.7" fill="#4aa8e8" stroke="#1d3556" stroke-width="1.2"/>`).join("");
  return `<svg viewBox="0 0 420 150" xmlns="http://www.w3.org/2000/svg" stroke-linejoin="round" stroke-linecap="round">
  <polygon points="78,${top+6} 38,${top-36} 66,${top-36} 128,${top+4}" fill="${tail}" stroke="#1d2433" stroke-width="3.5"/>
  <polygon points="84,62 36,${bot-2} 62,${bot} 130,66" fill="${tail}" stroke="#1d2433" stroke-width="3.5" opacity=".9"/>
  ${wing}
  <path d="M60 ${58-6*h} C60 ${top+2} 92 ${top} 140 ${top} L310 ${top} C356 ${top} 394 ${58-8*h} 404 58 C394 ${58+10*h} 356 ${bot} 310 ${bot} L140 ${bot} C92 ${bot} 60 ${bot-4} 60 ${58+6*h} Z" fill="${body}" stroke="#1d2433" stroke-width="3.5"/>
  <path d="M82 ${bot-9} L330 ${bot-9}" stroke="${acc}" stroke-width="${wide?9:7}" fill="none"/>
  ${wins}
  <path d="M352 ${top+6} Q376 ${top+7} 388 ${58-3} L352 ${58-3} Z" fill="#4aa8e8" stroke="#1d2433" stroke-width="2.5"/>
  ${eng}
  <path d="M110 ${top+4} Q200 ${top-1} 300 ${top+4}" stroke="#fff" stroke-width="3" opacity=".5" fill="none"/>
  </svg>`;
}

// ===== CIELO =====
function skyPhase(){const h=new Date().getHours()+new Date().getMinutes()/60;
  const m=new Date().getMonth(); const rise=m>9||m<2?7.4:m>3&&m<8?6:6.7, set=m>9||m<2?17:m>3&&m<8?20.6:18.6;
  if(h>rise+.7&&h<set-.7)return"day"; if(h>rise-.7&&h<set+.7)return"dusk"; return"night";}
function buildSky(){
  $("stars").innerHTML=Array.from({length:70},()=>`<i class="star" style="left:${Math.random()*100}%;top:${Math.random()*55}%;animation-delay:${Math.random()*3}s"></i>`).join("");
  $("clouds").innerHTML=Array.from({length:5},(_,i)=>`<div class="cl" style="width:${12+Math.random()*10}cqw;top:${8+Math.random()*34}cqh;animation-duration:${70+i*25}s;animation-delay:-${i*28}s"></div>`).join("");
}
function tick(){$("poster").dataset.t=skyPhase();$("clock").textContent="in diretta · "+new Date().toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"});}

// ===== DATI VOLO =====
const routeCache={};
async function getRoute(cs){
  if(!cs)return null; if(cs in routeCache)return routeCache[cs];
  try{const r=await fetch("https://api.adsbdb.com/v0/callsign/"+cs); const j=await r.json();
    return routeCache[cs]=j.response&&j.response.flightroute||null;}catch(e){return routeCache[cs]=null;}
}
async function fetchAircraft(){
  // interrogo tutte le fonti insieme e unisco i risultati (ognuna ha la sua copertura)
  const res=await Promise.allSettled(APIS.map(f=>fetch(f(HOME.lat,HOME.lon,RADIUS_NM)).then(r=>r.ok?r.json():Promise.reject(new Error('HTTP '+r.status)))));
  const map=new Map(); let ok=0, errs=[];
  res.forEach(r=>{if(r.status!=="fulfilled")errs.push(String(r.reason&&r.reason.message||r.reason));
    if(r.status==="fulfilled"){ok++;(r.value.ac||r.value.aircraft||[]).forEach(a=>{if(a.hex&&!map.has(a.hex))map.set(a.hex,a);});}});
  $("status").textContent=`fonti ${ok}/${APIS.length} · ${map.size} aerei nel raggio`+(errs.length?` · errore: ${errs[0]}`:"")+(location.protocol==="file:"?" · aperto da file locale":"");
  return ok?[...map.values()]:null;
}
let current=null;
function pick(list){
  const cand=list.filter(a=>a.lat!=null&&typeof a.alt_baro==="number"&&a.alt_baro>200&&(a.seen_pos==null||a.seen_pos<60)).map(a=>{
    const d=dist(HOME.lat,HOME.lon,a.lat,a.lon), alt=a.alt_baro*0.0003048;
    return {a,s:Math.hypot(d,alt)};}).sort((x,y)=>x.s-y.s);
  if(!cand.length)return null;
  const keep=cand.find(c=>c.a.hex===current);
  return (keep&&keep.s<cand[0].s*1.6?keep:cand[0]).a;
}
function kindOf(a){const t=a.t||""; if(WIDE.includes(t)||a.category==="A5")return"wide";
  if(PROP.includes(t)||a.category==="A1"||a.category==="A7")return"prop"; return"narrow";}
async function render(a){
  current=a.hex;
  const cs=(a.flight||"").trim(), pre=cs.slice(0,3), fr=await getRoute(cs);
  const liv=L[pre]||DEF, airline=(fr&&fr.airline&&fr.airline.name)||(L[pre]?L[pre][3]:"Volo");
  const el=$("plane"); el.innerHTML=planeSVG(kindOf(a),liv);
  const trk=a.track??a.true_heading??0; el.classList.toggle("flip",trk>180&&trk<360);
  const o=fr&&fr.origin, d=fr&&fr.destination;
  $("who").textContent=[airline,cs,NAMES[a.t]||a.t].filter(Boolean).join("  ·  ");
  const nm=x=>x?(x.iata_code||x.municipality):"?";
  const name=x=>x?(x.municipality||x.iata_code):"";
  $("route").innerHTML=fr?`${nm(o)} <i>→</i> ${nm(d)}`:(cs||"Volo in transito");
  const vr=a.baro_rate??a.geom_rate??0, st=vr>300?"in salita":vr<-300?"in discesa":"in quota";
  const km=dist(HOME.lat,HOME.lon,a.lat,a.lon);
  $("stats").innerHTML=`<div>${Math.round(a.alt_baro*0.3048)}<span>m</span></div><div>${Math.round((a.gs||0)*1.852)}<span>km/h</span></div><div>${st}</div><div>${km.toFixed(1)}<span>km da te</span></div>`+(fr?`<div style="margin-left:auto;font-weight:400;font-size:1.6cqw;opacity:.85">${name(o)} → ${name(d)}</div>`:"");
  $("arrow").style.transform=`rotate(${trk}deg)`;
  $("poster").classList.remove("idle");
}
async function loop(){
  const list=await fetchAircraft();
  if(list){const a=pick(list); if(a)await render(a); else{current=null;$("emptyTxt").textContent="Nessun aereo sopra di te";$("poster").classList.add("idle");}}
  else if(!current){$("emptyTxt").textContent="Non riesco a leggere i dati dei voli";$("poster").classList.add("idle");}
  setTimeout(loop,POLL_MS);
}
// ===== SCHERMO INTERO (click / tap) =====
function toggleFS(){
  const d=document, el=d.documentElement;
  const on=d.fullscreenElement||d.webkitFullscreenElement;
  try{
    if(on){(d.exitFullscreen||d.webkitExitFullscreen).call(d);}
    else{const f=el.requestFullscreen||el.webkitRequestFullscreen; if(f)f.call(el,{navigationUI:"hide"});}
  }catch(e){}
}
document.addEventListener("click",toggleFS);
document.addEventListener("keydown",e=>{if(e.key==="f"||e.key==="F")toggleFS();});

buildSky(); tick(); setInterval(tick,30000); loop();
</script>
</body>
</html>
