<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cielo sopra Vigevano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --sky1:#0d1b3a;--sky2:#2b3f7a;--ink:#fff;--cloud:#ffffff22;
  --w-drift:-20px;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#0a0f1f;font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif}
body{display:grid;place-items:center;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}
.poster{
  position:relative;container-type:size;width:min(100vw,177.78vh);aspect-ratio:16/9;overflow:hidden;color:var(--ink);
  background:linear-gradient(var(--sky1),var(--sky2));transition:background 2s;
}

/* Fasi di luce solare */
.poster[data-t=day]{--sky1:#4aa8f0;--sky2:#bfe6ff;--cloud:#ffffffcc}
.poster[data-t=dusk]{--sky1:#5b3d8f;--sky2:#ffa870;--cloud:#ffd9c299}
.poster[data-t=night]{--sky1:#0b1534;--sky2:#2a3a78;--cloud:#8fa0d533}

/* Meteo */
.poster[data-weather=cloudy]{--cloud:#cbd5e1bb}
.poster[data-weather=rain]{--sky1:#2a3b5c;--sky2:#4a5f82;--cloud:#5b6a82dd}
.poster[data-weather=storm]{--sky1:#111625;--sky2:#1f283d;--cloud:#2c3547ee}
.poster[data-weather=snow]{--sky1:#3b4d66;--sky2:#829bb8;--cloud:#e2e8f0ee}

.stars{position:absolute;inset:0;opacity:0;transition:opacity 2s;z-index:1}
.poster[data-t=night]:not([data-weather=rain]):not([data-weather=storm]) .stars{opacity:1}
.star{position:absolute;width:.25cqw;height:.25cqw;background:#fff;border-radius:50%;animation:tw 3s infinite alternate}
@keyframes tw{to{opacity:.2}}

/* Sole / Luna */
.orb{position:absolute;right:18.5cqw;top:6cqh;width:8.5cqw;height:8.5cqw;border-radius:50%;transition:all 2s;z-index:1}
.poster[data-t=day] .orb{background:#ffd93b;box-shadow:0 0 0 1.2cqw #ffd93b55,0 0 0 2.6cqw #ffd93b33}
.poster[data-t=dusk] .orb{background:#ff7a45;box-shadow:0 0 0 1.2cqw #ff7a4555;top:28cqh}
.poster[data-t=night] .orb{background:#f4ecd0;box-shadow:inset -2.2cqw -.6cqw 0 #cfc5a0}
.poster[data-weather=storm] .orb, .poster[data-weather=rain] .orb{opacity:0.35}

/* Nuvole */
#clouds{position:absolute;inset:0;z-index:2;pointer-events:none}
.cl{position:absolute;height:4.2cqh;border-radius:5cqh;background:var(--cloud);animation:drift linear infinite}
.cl::before,.cl::after{content:"";position:absolute;background:inherit;border-radius:50%}
.cl::before{width:5.2cqh;height:5.2cqh;left:18%;top:-2.4cqh}
.cl::after{width:7.5cqh;height:7.5cqh;left:42%;top:-3.8cqh}
@keyframes drift{from{transform:translateX(-30cqw)}to{transform:translateX(130cqw)}}
.windy .cl{animation-duration:18s!important}

/* Effetti meteo */
#weather-layer{position:absolute;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.drop{
  position:absolute;width:.15cqw;height:2.6cqh;background:linear-gradient(transparent,#ffffffcc);
  border-radius:2px;animation:rain-fall linear infinite;
}
@keyframes rain-fall{
  from{transform:translate3d(0,-10cqh,0)}
  to{transform:translate3d(var(--w-drift),110cqh,0)}
}
.flake{
  position:absolute;width:.6cqw;height:.6cqw;background:#ffffffdd;border-radius:50%;
  filter:blur(0.5px);animation:snow-fall linear infinite;
}
@keyframes snow-fall{
  0%{transform:translate3d(0,-5cqh,0)}
  50%{transform:translate3d(calc(var(--w-drift) + 4cqw),55cqh,0)}
  100%{transform:translate3d(var(--w-drift),110cqh,0)}
}
#lightning{position:absolute;inset:0;background:#eef5ff;opacity:0;pointer-events:none;z-index:4}
.storm #lightning{animation:flash 6.5s infinite}
@keyframes flash{
  0%,91%,93%,95%,100%{opacity:0}
  92%{opacity:.85}
  94%{opacity:.6}
}

/* Intestazione */
.top{position:absolute;left:4cqw;top:4cqh;font-size:2.2cqw;font-weight:600;opacity:.95;z-index:5}
.top small{display:block;font-size:1.4cqw;font-weight:400;opacity:.8}
.live{display:flex;gap:.8cqw;align-items:center;font-size:1.4cqw;font-weight:400;opacity:.85;margin-top:.4cqh}
.dot{width:1.1cqw;height:1.1cqw;border-radius:50%;background:#ff4b4b;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
.weather-tag{margin-left:.6cqw;font-size:1.2cqw;padding:.2cqh .8cqw;background:#ffffff1f;border-radius:2cqw}

/* RADAR CIRCOLARE SU VIGEVANO */
.radar-box{
  position:absolute;right:3.2cqw;top:3.2cqh;width:13cqw;height:13cqw;border-radius:50%;
  background:radial-gradient(circle, #08172ee6 0%, #030814f8 100%);
  border:.24cqw solid #ffffff40;box-shadow:0 .8cqh 2cqh #000a, inset 0 0 1.2cqw #000000a0;
  overflow:hidden;z-index:6;pointer-events:none;
}
.radar-circle{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);border-radius:50%;border:.08cqw dashed #ffffff25;}
.radar-circle.c1{width:33.3%;height:33.3%;}
.radar-circle.c2{width:66.6%;height:66.6%;}
.radar-circle.c3{width:99%;height:99%;border-style:solid;border-color:#ffffff35;}
.radar-axis-h{position:absolute;top:50%;left:0;right:0;height:1px;background:#ffffff18;}
.radar-axis-v{position:absolute;left:50%;top:0;bottom:0;width:1px;background:#ffffff18;}
.radar-sweep{
  position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg, transparent 0deg, transparent 300deg, #38bdf818 345deg, #38bdf850 360deg);
  animation:radar-rotate 4s linear infinite;
}
@keyframes radar-rotate{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.radar-home{
  position:absolute;left:50%;top:50%;width:.5cqw;height:.5cqw;background:#38bdf8;
  border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 .5cqw #38bdf8;z-index:3;
}
.radar-n{position:absolute;top:.3cqh;left:50%;transform:translateX(-50%);font-size:.7cqw;font-weight:700;color:#ff5a4d;z-index:4}
#radar-targets{position:absolute;inset:0;z-index:5}
.radar-ac{position:absolute;transform:translate(-50%,-50%);display:grid;place-items:center}
.radar-ping{
  position:absolute;width:2.2cqw;height:2.2cqw;border-radius:50%;background:#ff383838;
  border:.12cqw solid #ff3838;animation:radar-ping 1.2s infinite ease-out;
}
@keyframes radar-ping{0%{transform:scale(0.2);opacity:1}100%{transform:scale(1.8);opacity:0}}

/* Aereo centrato in X e Y */
#stage{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:4}
#plane{width:68cqw;filter:drop-shadow(0 1.6cqh 0 #0003);animation:bob 4.5s ease-in-out infinite}
#plane.flip{transform:scaleX(-1)}
#plane svg{width:100%;display:block;overflow:visible}
@keyframes bob{50%{translate:0 -1.6cqh;rotate:-1.2deg}}
.windy #plane{animation:bob 2.8s ease-in-out infinite, turb 0.4s ease-in-out infinite alternate}
@keyframes turb{from{translate:0 -.3cqh}to{translate:0 .3cqh}}
.prop{transform-origin:center;transform-box:fill-box;animation:spin .12s linear infinite}
@keyframes spin{to{transform:scaleY(-1)}}

/* Info volo */
.info{
  position:absolute;left:0;right:0;bottom:0;min-height:34cqh;padding:0 4cqw 3.5cqh;display:flex;flex-direction:column;justify-content:flex-end;
  background:linear-gradient(#0000,#0b1020dd 50%);z-index:5;pointer-events:none;
}
.poster[data-t=day] .info{background:linear-gradient(#0000,#0b2a5add 50%)}
.who{font-size:1.8cqw;font-weight:400;opacity:.9}
.route{font-size:6.4cqw;font-weight:700;line-height:1.02;letter-spacing:-.02em;white-space:nowrap}
.route i{font-style:normal;color:#ffd93b;padding:0 1.2cqw}
.airports{font-size:1.7cqw;font-weight:500;opacity:.88;margin-top:.4cqh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.airports i{font-style:normal;color:#ffd93b;padding:0 .8cqw;opacity:.75}
.stats{display:flex;gap:3.2cqw;font-size:2cqw;font-weight:600;margin-top:1cqh}
.stats span{font-weight:400;opacity:.75;font-size:1.5cqw;margin-left:.4cqw}

/* Bussola */
.compass{position:absolute;right:4cqw;bottom:11cqh;width:7cqw;height:7cqw;border:.35cqw solid #fff9;border-radius:50%;display:grid;place-items:center;font-size:1.3cqw;z-index:5}
.compass b{position:absolute;top:-2cqw;font-weight:600}
.compass svg{width:3.6cqw;transition:transform 1s}

/* Diagnostica in basso a destra */
#status{position:absolute;right:4cqw;bottom:2.2cqh;max-width:50cqw;font-size:.95cqw;line-height:1.45;opacity:.8;text-align:right;z-index:5}
#status .bad{color:#ff8a80;font-weight:600}
#status .good{color:#9be59b;font-weight:600}

#empty{position:absolute;inset:0;display:none;place-items:center;text-align:center;font-size:4cqw;font-weight:600;padding:0 8cqw;z-index:6}
#empty small{display:block;font-weight:400;font-size:1.8cqw;opacity:.8;margin-top:1.2cqh}
.idle #stage,.idle .info,.idle .compass{display:none}
.idle #empty{display:grid}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="poster idle" id="poster" data-t="night">
  <div class="stars" id="stars"></div>
  <div class="orb"></div>

  <div id="weather-layer"></div>
  <div id="lightning"></div>
  
  <div class="top">Il cielo sopra Vigevano
    <div class="live">
      <div class="dot"></div>
      <span id="clock"></span>
      <span class="weather-tag" id="weather-desc">Meteo…</span>
    </div>
  </div>

  <!-- RADAR CIRCOLARE SU VIGEVANO -->
  <div class="radar-box">
    <div class="radar-sweep"></div>
    <div class="radar-circle c1"></div>
    <div class="radar-circle c2"></div>
    <div class="radar-circle c3"></div>

    <div class="radar-axis-v"></div>
    <div class="radar-n">N</div>

  <div id="stage"><div id="plane"></div></div>
  <div class="info">
    <div class="who" id="who"></div>
    <div class="route" id="route"></div>
    <div class="airports" id="airports"></div>

  </div>

    <svg id="arrow" viewBox="0 0 20 20"><path d="M10 1 L16 18 L10 14 L4 18Z" fill="#ff5a4d"/></svg></div>
  <div id="status"></div>
  <div id="empty"><div><span id="emptyTxt">Cerco aerei sopra di te…</span><small>Resto in ascolto: appena ne passa uno lo disegno.</small></div></div>
</div>

const WIDE = "A332 A333 A338 A339 A359 A35K A388 B744 B748 B772 B77L B77W B788 B789 B78X B763 B764 A306 A310 MD11".split(" ");
const PROP = "AT43 AT45 AT72 AT75 AT76 DH8A DH8B DH8C DH8D SF34 E120 PC12 B190 SW4 C208".split(" ");
const NAMES = {A319:"Airbus A319",A320:"Airbus A320",A20N:"Airbus A320neo",A321:"Airbus A321",A21N:"Airbus A321neo",
  A332:"Airbus A330-200",A333:"Airbus A330-300",A359:"Airbus A350-900",A35K:"Airbus A350-1000",A388:"Airbus A380",

  CRJ9:"CRJ-900",C172:"Cessna 172",PC12:"Pilatus PC-12"};

const $ = id => document.getElementById(id);
const rad = d => d*Math.PI/180;
const dist = (a,b,c,d)=>{const R=6371,x=rad(c-a),y=rad(d-b);
  const h=Math.sin(x/2)**2+Math.cos(rad(a))*Math.cos(rad(c))*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(h));};

function planeSVG(kind,[body,tail,acc]){
  const wide = kind==="wide", prop = kind==="prop";
  const h = wide?1.28:prop?.9:1, top = 58-26*h, bot = 58+26*h;
  const eng = prop
    ? `<rect x="238" y="74" width="34" height="16" rx="8" fill="#6d7686"/><g class="prop"><ellipse cx="392" cy="${58}" rx="5" ry="30" fill="#2b2f3a" opacity=".75"/></g>`
    : `<rect x="212" y="${bot-4}" width="56" height="${wide?26:21}" rx="10" fill="#c9d0db" stroke="#7a8496" stroke-width="3"/>
       <ellipse cx="214" cy="${bot+(wide?9:6)}" rx="5" ry="${wide?10:8}" fill="#4a5262"/>`;
  const wing = prop ? `<polygon points="170,${top+4} 300,${top+4} 292,${top+14} 176,${top+14}" fill="#dfe4ec" stroke="#8a93a4" stroke-width="3"/>`
    : `<polygon points="232,${58} 278,${58} 208,${bot+32} 170,${bot+32}" fill="${body==="#f4f6fa"?"#dfe4ec":body}" stroke="#8a93a4" stroke-width="3" stroke-linejoin="round"/>`;
  const wins = Array.from({length:wide?20:15},(_,i)=>`<circle cx="${112+i*(wide?10.4:12.6)}" cy="${top+13}" r="2.7" fill="#4aa8e8" stroke="#1d3556" stroke-width="1.2"/>`).join("");
  return `<svg viewBox="0 0 420 150" xmlns="http://www.w3.org/2000/svg" stroke-linejoin="round" stroke-linecap="round">
  <polygon points="78,${top+6} 38,${top-36} 66,${top-36} 128,${top+4}" fill="${tail}" stroke="#1d2433" stroke-width="3.5"/>
  <polygon points="84,62 36,${bot-2} 62,${bot} 130,66" fill="${tail}" stroke="#1d2433" stroke-width="3.5" opacity=".9"/>
  ${wing}
  <path d="M60 ${58-6*h} C60 ${top+2} 92 ${top} 140 ${top} L310 ${top} C356 ${top} 394 ${58-8*h} 404 58 C394 ${58+10*h} 356 ${bot} 310 ${bot} L140 ${bot} C92 ${bot} 60 ${bot-4} 60 ${58+6*h} Z" fill="${body}" stroke="#1d2433" stroke-width="3.5"/>
  <path d="M82 ${bot-9} L330 ${bot-9}" stroke="${acc}" stroke-width="${wide?9:7}" fill="none"/>
  ${wins}

}

// ===== RADAR CIRCOLARE (30 KM SU VIGEVANO) =====
function updateRadar(aircraftList, activeHex) {
  const MAX_KM = 30;
  const container = $("radar-targets");
  if (!container) return;
  let html = "";

  (aircraftList || []).forEach(a => {
    if (a.lat == null || a.lon == null) return;
    const dLat = (a.lat - HOME.lat) * 111.132;
    const dLon = (a.lon - HOME.lon) * 111.32 * Math.cos(HOME.lat * Math.PI / 180);
    const distKm = Math.hypot(dLat, dLon);
    if (distKm > MAX_KM) return;

    const xPct = 50 + (dLon / MAX_KM) * 47;
    const yPct = 50 - (dLat / MAX_KM) * 47;
    const isCurrent = (a.hex === activeHex);
    const trk = a.track ?? a.true_heading ?? 0;
    const col = isCurrent ? "#ff3838" : "#ffd000";
    const sz = isCurrent ? "1.6cqw" : "1.2cqw";

    html += `
      <div class="radar-ac" style="left:${xPct}%;top:${yPct}%;">
        ${isCurrent ? '<div class="radar-ping"></div>' : ''}
        <svg viewBox="0 0 24 24" style="width:${sz};height:${sz};transform:rotate(${trk}deg);filter:drop-shadow(0 1px 2px #000)">
          <path d="M12 2 L15.5 10 L22 12.5 L22 14.5 L14 13.5 L14 19 L16 21 L16 22 L12 21 L8 22 L8 21 L10 19 L10 13.5 L2 14.5 L2 12.5 L8.5 10 Z" fill="${col}"/>
        </svg>
      </div>`;
  });
  container.innerHTML = html;
}

// ===== GESTIONE METEO (Open-Meteo) =====
function setSkyTheme(type, isWindy) {
  const p = $("poster");
  p.dataset.weather = type;
  p.classList.toggle("windy", isWindy);
  p.classList.toggle("storm", type === "storm");

  const drift = isWindy ? "-65px" : "-20px";
  document.documentElement.style.setProperty("--w-drift", drift);

  const wLayer = $("weather-layer");
  wLayer.innerHTML = "";
  if (type === "rain" || type === "storm") {
    const count = type === "storm" ? 55 : 35;
    for (let i = 0; i < count; i++) {
      const drop = document.createElement("div");
      drop.className = "drop";
      drop.style.left = `${Math.random() * 110 - 5}%`;
      drop.style.top = `${Math.random() * -30}%`;
      drop.style.animationDuration = `${0.45 + Math.random() * 0.35}s`;
      drop.style.animationDelay = `${Math.random() * 2}s`;
      wLayer.appendChild(drop);
    }
  } else if (type === "snow") {
    for (let i = 0; i < 40; i++) {
      const flake = document.createElement("div");
      flake.className = "flake";
      flake.style.left = `${Math.random() * 110 - 5}%`;
      flake.style.top = `${Math.random() * -30}%`;
      flake.style.animationDuration = `${2.5 + Math.random() * 3}s`;
      flake.style.animationDelay = `${Math.random() * 3}s`;
      flake.style.transform = `scale(${0.5 + Math.random()})`;
      wLayer.appendChild(flake);
    }
  }
}

async function fetchWeather() {
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${HOME.lat}&longitude=${HOME.lon}&current=temperature_2m,weather_code,cloud_cover,wind_speed_10m,wind_gusts_10m&timezone=auto`;
    const r = await fetch(url);
    if (!r.ok) return;
    const j = await r.json();
    const c = j.current;
    if (!c) return;

    const code = c.weather_code;
    const wind = c.wind_speed_10m || 0;
    const gusts = c.wind_gusts_10m || wind;
    const temp = Math.round(c.temperature_2m);
    const isWindy = wind >= 28 || gusts >= 38;

    let type = "clear", desc = "Sereno";
    if (code === 0) { type = "clear"; desc = "Sereno"; }
    else if (code >= 1 && code <= 2) { type = "clear"; desc = "Poco nuvoloso"; }
    else if (code === 3) { type = "cloudy"; desc = "Coperto"; }
    else if (code === 45 || code === 48) { type = "cloudy"; desc = "Nebbia"; }
    else if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) {
      type = "rain"; desc = code >= 65 ? "Pioggia forte" : "Pioggia";
    } else if ((code >= 71 && code <= 77) || (code >= 85 && code <= 86)) {
      type = "snow"; desc = "Neve";
    } else if (code >= 95) {
      type = "storm"; desc = "Temporale";
    }

    if (isWindy) desc += " · Vento";
    $("weather-desc").textContent = `${temp}°C · ${desc}`;
    setSkyTheme(type, isWindy);
  } catch (e) {
    $("weather-desc").textContent = "Meteo locale";
  }
}

function skyPhase(){
  const h=new Date().getHours()+new Date().getMinutes()/60;
  const m=new Date().getMonth();
  const rise=m>9||m<2?7.4:m>3&&m<8?6:6.7, set=m>9||m<2?17:m>3&&m<8?20.6:18.6;
  if(h>rise+.7&&h<set-.7)return"day";
  if(h>rise-.7&&h<set+.7)return"dusk";
  return"night";
}

function buildSky(){
  $("stars").innerHTML=Array.from({length:70},()=>`<i class="star" style="left:${Math.random()*100}%;top:${Math.random()*55}%;animation-delay:${Math.random()*3}s"></i>`).join("");
  $("clouds").innerHTML=Array.from({length:6},(_,i)=>`<div class="cl" style="width:${13+Math.random()*12}cqw;top:${6+Math.random()*36}cqh;animation-duration:${65+i*22}s;animation-delay:-${i*20}s"></div>`).join("");
}

function tick(){
  $("poster").dataset.t = skyPhase();
  $("clock").textContent = "in diretta · " + new Date().toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"});
}

function formatAirport(ap, code) {
  if (code && AIRPORTS[code]) return AIRPORTS[code];
  if (ap) {
    const city = ap.municipality || "";
    let name = ap.name || "";
    name = name.replace(/\b(International Airport|Intercontinental Airport|Airport|Aeroporto Internazionale|Aeroporto di|Aeroporto)\b/gi, "").trim();
    if (city && name && !name.toLowerCase().includes(city.toLowerCase())) {
      return `${city} (${name})`;
    }
    return name || city || ap.iata_code || code || "";
  }
  return code || "";
}

const routeCache={};
async function getRoute(cs){
  if(!cs)return null;
  if(cs in routeCache)return routeCache[cs];
  try{
    const r=await fetch(`${WORKER}/route?cs=${cs}`);
    const j=await r.json();
    return routeCache[cs]=j.response&&j.response.flightroute||null;
  }catch(e){return routeCache[cs]=null;}
}

let st1="", diagLine="";
function paint(){$("status").innerHTML=st1+(diagLine?"<br>"+diagLine:"");}
function setSt(t){st1=t;paint();}

async function runDiag(){
  try{
    const r=await fetch(`${WORKER}/diag?lat=${HOME.lat.toFixed(3)}&lon=${HOME.lon.toFixed(3)}`);
    const j=await r.json();
    diagLine=j.map(x=>x.ok?`<span class="good">${x.name} ✓${x.n!=null?" "+x.n+" aerei":""} ${x.ms}ms</span>`
      :`<span class="bad">${x.name} ✗ ${x.err||("HTTP "+x.status)}</span>`).join(" · ");
  }catch(e){diagLine=`<span class="bad">diagnostica offline</span>`;}
  paint();
}

async function fetchAircraft(){
  try{
    const r=await fetch(`${WORKER}/ac?lat=${HOME.lat.toFixed(3)}&lon=${HOME.lon.toFixed(3)}&dist=${RADIUS_NM}`);
    const j=await r.json();
    if(!r.ok)throw new Error(j.error||"HTTP "+r.status);
    setSt(`<span class="good">worker ✓</span> · <b>${j.srcName}</b> · ${j.ac.length} aerei`);
    return j.ac;
  }catch(e){
    setSt(`<span class="bad">worker ✗ ${e.message}</span>`);
    return null;
  }
}

let current=null;
let lastList=[];

function pick(list){
  const cand=list.filter(a=>a.lat!=null&&typeof a.alt_baro==="number"&&a.alt_baro>200&&(a.seen_pos==null||a.seen_pos<60)).map(a=>{
    const d=dist(HOME.lat,HOME.lon,a.lat,a.lon), alt=a.alt_baro*0.0003048;
    return {a,s:Math.hypot(d,alt)};}).sort((x,y)=>x.s-y.s);
  if(!cand.length)return null;
  const keep=cand.find(c=>c.a.hex===current);
  return (keep&&keep.s<cand[0].s*1.6?keep:cand[0]).a;
}

function kindOf(a){
  const t=a.t||"";
  if(WIDE.includes(t)||a.category==="A5")return"wide";
  if(PROP.includes(t)||a.category==="A1"||a.category==="A7")return"prop";
  return"narrow";
}

async function render(a){
  current=a.hex;
  const cs=(a.flight||"").trim(), pre=cs.slice(0,3);

  // Aggiorna radar evidenziando l'aereo corrente in rosso
  updateRadar(lastList, current);

  // PRIORITÀ TRATTA: Flightradar24 in diretta
  let origIata = a.orig_iata || "";
  let destIata = a.dest_iata || "";
  let o = null, d = null, fr = null;

  if(!origIata || !destIata){
    fr = await getRoute(cs);
    if(fr && fr.origin && fr.destination){
      o = fr.origin;
      d = fr.destination;
      if(!origIata) origIata = o.iata_code || "";
      if(!destIata) destIata = d.iata_code || "";
    }
  }

  const liv = L[pre] || DEF;
  const airline = (L[pre] ? L[pre][3] : null) || (fr && fr.airline && fr.airline.name) || "Volo";
  const el = $("plane");
  const trk = a.track ?? a.true_heading ?? 0;

  el.innerHTML = planeSVG(kindOf(a), liv);
  el.classList.toggle("flip", trk > 180 && trk < 360);

  $("who").textContent = [airline, cs, NAMES[a.t]||a.t].filter(Boolean).join("  ·  ");

  // Codici IATA in grande
  if(origIata && destIata){
    $("route").innerHTML = `${origIata} <i>→</i> ${destIata}`;
  } else {
    $("route").innerHTML = cs || "Volo in transito";
  }

  // Nome aeroporti sotto
  const origName = formatAirport(o, origIata);
  const destName = formatAirport(d, destIata);
  if(origName && destName){
    $("airports").innerHTML = `${origName} <i>→</i> ${destName}`;
    $("airports").style.display = "block";
  } else if(origName || destName){
    $("airports").textContent = origName || destName;
    $("airports").style.display = "block";
  } else {
    $("airports").textContent = "";
    $("airports").style.display = "none";
  }

  // Quota e velocità
  const vr = a.baro_rate ?? a.geom_rate ?? 0;
  let st = vr > 250 ? "in salita" : (vr < -250 ? "in discesa" : "in quota");
  if (a.alt_baro < 8000 && (destIata === "MXP" || destIata === "LIN" || destIata === "BGY")) {
    st = vr < -100 ? "in atterraggio" : "in avvicinamento";
  }

  const km = dist(HOME.lat, HOME.lon, a.lat, a.lon);
  $("stats").innerHTML = `<div>${Math.round(a.alt_baro*0.3048)}<span>m</span></div><div>${Math.round((a.gs||0)*1.852)}<span>km/h</span></div><div>${st}</div><div>${km.toFixed(1)}<span>km da te</span></div>`;
  $("arrow").style.transform = `rotate(${trk}deg)`;
  $("poster").classList.remove("idle");
}

async function loop(){
  const list = await fetchAircraft();
  if(list){
    lastList = list;
    const a = pick(list);
    if(a) {
      await render(a);
    } else {
      current = null;
      updateRadar(lastList, null);
      $("emptyTxt").textContent = "Nessun aereo sopra di te";
      $("poster").classList.add("idle");
    }
  } else if(!current){
    updateRadar([], null);
    $("emptyTxt").textContent = "Non riesco a leggere i dati dei voli";
    $("poster").classList.add("idle");
  }
  setTimeout(loop, POLL_MS);
}

function toggleFS(){
  const d = document, el = d.documentElement;
  const on = d.fullscreenElement || d.webkitFullscreenElement;
  try{
    if(on){ (d.exitFullscreen||d.webkitExitFullscreen).call(d); }
    else{ const f = el.requestFullscreen||el.webkitRequestFullscreen; if(f) f.call(el,{navigationUI:"hide"}); }
  }catch(e){}
}
document.addEventListener("click", toggleFS);
document.addEventListener("keydown", e => { if(e.key === "f" || e.key === "F") toggleFS(); });

buildSky();
tick();
setInterval(tick, 30000);

// Meteo ogni 5 minuti (Open-Meteo)
fetchWeather();
setInterval(fetchWeather, 300000);

loop();
setTimeout(() => { runDiag(); setInterval(runDiag, 180000); }, 2000);
</script>
